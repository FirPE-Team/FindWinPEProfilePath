[package]
name = "FindWinPEProfilePath"
version = "1.1.0"
edition = "2024"

[build-dependencies]
embed-resource = "3.0.6"
thunk-rs = "0.3.5"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5", features = ["derive"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
windows-registry = "0.6"
